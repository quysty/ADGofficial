<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>地图工具 | ANU Dorm Guide</title>
  <link rel="stylesheet" href="style.css?v=territory-sharpness-v1" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
      }
    }
  </script>
</head>
<body data-page="map-tool">
  <main class="subpage-main">
    <section class="subpage-hero">
      <div class="container">
        <p class="eyebrow">地图工具</p>
        <h1>地图工具</h1>
        <p class="subtitle">
          开发坐标拾取页。
        </p>
      </div>
    </section>

    <section class="section explore-map-section">
      <div class="container">
        <div id="exploreSceneLayout" class="explore-layout-v3">
          <div id="exploreMapWrap" class="explore-map-wrap">
            <div class="explore-map-shell">
              <div class="explore-map-toolbar">
                <div id="sceneModeToggle" class="explore-mode-toggle" data-mode="3d">
                  <button id="btn3D" class="explore-mode-button is-active" type="button">3D</button>
                  <button id="btn2D" class="explore-mode-button" type="button">2D</button>
                </div>

                <button id="btnNumbers" class="explore-toolbar-button" type="button">
                  Developer Off
                </button>

                <button id="btnReset" class="explore-toolbar-button" type="button">
                  Reset
                </button>
              </div>

              <div id="sceneVeil" class="explore-scene-veil"></div>
              <div id="map3dContainer" class="explore-map-canvas"></div>
            </div>
          </div>

          <aside id="exploreSideWrap" class="explore-side-wrap">
            <section id="overviewPanel" class="scene-panel scene-panel-overview is-active">
              <p class="eyebrow">地图工具</p>
              <h2>点位坐标</h2>

              <p id="mapStatus" class="scene-panel-status">
                地图工具加载中...
              </p>
            </section>

            <section id="detailPanel" class="scene-panel scene-panel-detail" aria-hidden="true">
              <div class="scene-detail-head">
                <p class="scene-detail-kicker">地图工具</p>
                <h3 id="detailTitle">点位详情</h3>
                <p id="detailCode" class="scene-detail-code">-</p>
              </div>

              <div id="detailScroll" class="scene-detail-scroll"></div>

              <button id="btnBackOverview" class="scene-detail-back" type="button">
                返回地图工具
              </button>
            </section>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div id="site-nav-root"></div>

  <script src="nav.js?v=nav-order-v1"></script>
  <script src="src/data/dorms.js?v=new-dorm-placeholders-v1"></script>
  <script type="module" src="explore.js?v=territory-sharpness-v1"></script>
</body>
</html>
